# Builds the Sadhna Healing phone apps on GitHub's servers and saves the files
# to the branch "sadhna-healing-builds" (Android APK + iPhone build).
name: Build Sadhna Healing app
on:
  push:
    branches: [sadhna-healing-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Sadhna-Healing-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Sadhna-Healing-Android.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Unsigned: proves the iPhone app builds. Installing on iPhones needs Apple signing (see README).
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir Payload && cp -r Runner.app Payload/
          zip -qr "$GITHUB_WORKSPACE/Sadhna-Healing-iPhone-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Sadhna-Healing-iPhone-unsigned.ipa }

  publish:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Save the files to the sadhna-healing-builds branch
        run: |
          mkdir site && cd site
          git init -q -b sadhna-healing-builds
          cp ../out/* . 2>/dev/null || true
          {
            echo "Built from commit $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Android job: ${{ needs.android.result }}"
            echo "iPhone job: ${{ needs.ios.result }}"
            ls -la
          } > BUILD-INFO.txt
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Sadhna Healing app build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sadhna-healing-builds
