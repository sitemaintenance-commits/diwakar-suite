    render(false); return;
  }
  if(ds.removeLeave){ captureModal(); const [f,t] = ds.removeLeave.split("|"); const cur = state.modal.leave || (schedOf(healer(state.modal.id)).leave||[]); state.modal.leave = cur.filter(l=>!(l.from===f && (l.to||"")===t)); render(false); return; }
  if(ds.saveSchedule !== undefined){
    captureModal(); const v = state.modal.vals, h = healer(state.modal.id), s = schedOf(h);
    const days = [0,1,2,3,4,5,6].filter(d=>v["d:"+d]);
    if(toMin(v.end) - toMin(v.start) < CONFIG.slotMinutes){ toast("The working day must be at least one session long."); return; }
    if((v.breakStart && !v.breakEnd) || (!v.breakStart && v.breakEnd) || (v.breakStart && toMin(v.breakEnd) <= toMin(v.breakStart))){ toast("Set both break times, with the end after the start, or leave both empty."); return; }
    await ensureCatalog();
    const schedule = { days, start:v.start, end:v.end, breakStart:v.breakStart||"", breakEnd:v.breakEnd||"", leave:state.modal.leave || s.leave || [] };
    await Data.put("healers", h.id, Object.assign({}, healer(h.id), { schedule })); log("Schedule updated", h.name); toast("Schedule saved"); closeModal(); return;
  }

  /* admin: therapies */
  if(ds.editTherapy !== undefined && el.matches("[data-edit-therapy]")){ state.modal = { type:"therapy", id:ds.editTherapy||null }; render(false); return; }
  if(ds.saveTherapy !== undefined){
    captureModal(); const v = state.modal.vals, id = state.modal.id;
    const full = (v.full||"").trim(), price = Number(v.price), mins = Number(v.mins);
    if(full.length<2){ toast("Enter the therapy name."); return; }
    if(!(price>=0)){ toast("Enter a valid price."); return; }
    if(!(mins>=15)){ toast("Enter a duration of at least 15 minutes."); return; }
    await ensureCatalog();
    const lines = s => String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
    const old = id ? therapy(id) : { id:slugId(full,"therapies"), order:therapies().length+1 };
    const t = Object.assign({}, old, { full, name:(v.name||"").trim()||full, code:(v.code||"").trim()||full.slice(0,2), price, mins, desc:(v.desc||"").trim(), about:(v.about||"").trim(), who:(v.who||"").trim(), prep:lines(v.prep), benefits:lines(v.benefits), active:!!v.active });
    await Data.put("therapies", t.id, t);
    if(!id){ for(const h of healers()) await Data.put("healers", h.id, Object.assign({}, h, { therapies:h.therapies.concat([t.id]) })); }
    log(id?"Therapy edited":"Therapy added", `${t.full} · ${rupees(t.price)} · ${t.mins} min`); toast("Therapy saved"); closeModal(); return;
  }
  if(ds.toggleTherapy){ await ensureCatalog(); const t = therapy(ds.toggleTherapy), on = t.active===false; Data.put("therapies", t.id, Object.assign({}, t, { active:on })); log(on?"Therapy shown":"Therapy hidden", t.full); rerender(); return; }
  if(ds.deleteTherapy){
    const t = therapy(ds.deleteTherapy), up = bookingsAll().filter(b=>b.therapyId===t.id && isUpcoming(b)).length;
    if(up){ state.modal = { type:"info", title:"Can't delete yet", html:`<p>${esc(t.full)} has ${up} upcoming booking${up===1?"":"s"}. Hide it instead so no new bookings come in.</p>` }; render(false); return; }
    askConfirm(`Delete ${t.full}? Past bookings keep their records.`, async()=>{ await ensureCatalog(); await Data.del("therapies", t.id); log("Therapy deleted", t.full); toast("Therapy deleted"); render(false); }, { yes:"Delete therapy", danger:true, title:"Delete therapy?" });
    return;
  }
  if(ds.setAllPrices !== undefined){
    askConfirm(`Set every therapy to ${rupees(PRICE)} and ${MINS} minutes? Existing bookings keep the price they were booked at.`, async()=>{
      await ensureCatalog(); for(const t of therapies()) await Data.put("therapies", t.id, Object.assign({}, t, { price:PRICE, mins:MINS }));
      log("All therapy prices set", `${rupees(PRICE)} · ${MINS} min`); toast("Prices updated"); render(false);
    }, { yes:"Update all" });
    return;
  }

  /* admin: staff & permissions */
  if(ds.editStaff !== undefined && el.matches("[data-edit-staff]")){ state.modal = { type:"staff", id:ds.editStaff||null }; render(false); return; }
  if(ds.saveStaff !== undefined){
    captureModal(); const v = state.modal.vals, id = state.modal.id, me = currentStaff();
    const name = (v.name||"").trim(), username = id || (v.username||"").trim().toLowerCase(), pw = v.password||"";
    if(name.length<2){ toast("Enter the staff member's name."); return; }
    if(!id){ if(!/^[a-z0-9._-]{3,30}$/.test(username)){ toast("Username: 3 to 30 letters, numbers, dots or dashes."); return; } if(Data.get("staff", username)){ toast("That username is taken."); return; } }
    if((!id || pw) && pw.length<8){ toast("Password must be at least 8 characters."); return; }
    const old = id ? Data.get("staff", id) : { username, active:true, createdAt:new Date().toISOString() };
    const role = id===me.username ? old.role : (v.role||"reception");
    if(id && old.role==="superadmin" && role!=="superadmin" && Data.all("staff").filter(s=>s.role==="superadmin" && s.active!==false).length<2){ toast("Keep at least one active super admin."); return; }
    let s = Object.assign({}, old, { name, role, healerId: role==="healer" ? (v.healerId||"") : "" });
    if(pw) s = Object.assign(await withPassword(s, pw), { mustChange:true });
    await Data.put("staff", username, s); log(id?"Staff edited":"Staff added", `${name} · ${ROLES[role]}`); toast("Staff saved"); closeModal(); return;
  }
  if(ds.toggleStaff){
    const s = Data.get("staff", ds.toggleStaff), on = s.active===false;
    if(!on && s.role==="superadmin" && Data.all("staff").filter(x=>x.role==="superadmin" && x.active!==false).length<2){ toast("Keep at least one active super admin."); return; }
    Data.put("staff", s.username, Object.assign({}, s, { active:on })); log(on?"Staff activated":"Staff deactivated", s.username); rerender(); return;
  }
  if(ds.deleteStaff){
    const s = Data.get("staff", ds.deleteStaff);
    if(s.role==="superadmin" && Data.all("staff").filter(x=>x.role==="superadmin").length<2){ toast("Keep at least one super admin."); return; }
    askConfirm(`Delete the staff account ${s.username} (${s.name})?`, async()=>{ await Data.del("staff", s.username); log("Staff deleted", s.username); toast("Staff deleted"); render(false); }, { yes:"Delete", danger:true, title:"Delete staff account?" });
    return;
  }
  if(ds.resetRoles !== undefined){ askConfirm("Restore the default permissions for Admin, Reception and Healer?", async()=>{ await Data.put("config","roles",{ roles:DEFAULT_ROLES }); log("Permissions restored to defaults"); toast("Defaults restored"); render(false); }, { yes:"Restore" }); return; }

  /* admin: settings */
  if(ds.saveSettings !== undefined){
    const cur = Data.get("config","centre") || {};
    const wa = digits($("#st-wa").value);
    if(wa && !validPhone(wa)){ toast("Enter a 10-digit WhatsApp number or leave it empty."); return; }
    Data.put("config","centre", Object.assign({}, cur, { centreName:$("#st-name").value.trim()||CONFIG.centreName, centreAddress:$("#st-address").value.trim(), centrePhone:$("#st-phone").value.trim(), centreWhatsApp:wa, centreHours:$("#st-hours").value.trim(), daysAhead:Math.min(90, Math.max(1, Number($("#st-days").value)||21)), demoMode:$("#st-demo").value==="1" }));
    log("Centre settings saved"); toast("Settings saved"); return;
  }
  if(ds.saveTemplates !== undefined){
    const cur = Data.get("config","centre") || {}, t = {};
    Object.keys(DEFAULT_TEMPLATES).forEach(k=>{ t[k] = $("#tp-"+k).value.trim() || DEFAULT_TEMPLATES[k]; });
    Data.put("config","centre", Object.assign({}, cur, { templates:t })); log("WhatsApp messages saved"); toast("Messages saved"); return;
  }
  if(ds.backup !== undefined){ backup(); return; }
  if(ds.pruneActivity !== undefined){
    const cut = addDays(today(), -90), old = Data.all("activity").filter(d=>d.day < cut);
    if(!old.length){ toast("Nothing older than 90 days."); return; }
    askConfirm(`Delete ${old.length} day${old.length===1?"":"s"} of activity older than 90 days?`, async()=>{ for(const d of old) await Data.del("activity", d.day); toast("Old activity deleted"); render(false); }, { yes:"Delete", danger:true });
    return;
  }
  if(ds.reset !== undefined){
    askConfirm("Delete all bookings, patients, staff and settings saved in this browser?", ()=>{
      try{ localStorage.removeItem(CONFIG.storageKey); }catch(_){}
      loadLocal(); seedLocalDemo().then(()=>{ logout("App data reset"); });
    }, { yes:"Delete everything", danger:true, title:"Reset this device?" });
    return;
  }
});

document.addEventListener("change", async e => {
  const id = e.target.id, f = state.filter;
  if(id==="flt-date"){ f.date=e.target.value; rerender(); }
  if(id==="flt-healer"){ f.healer=e.target.value; rerender(); }
  if(id==="flt-status"){ f.status=e.target.value; rerender(); }
  if(id==="flt-therapy"){ f.therapy=e.target.value; rerender(); }
  if(id==="rep-from"||id==="rep-to"){ state.rep[id==="rep-from"?"from":"to"] = e.target.value; if(state.rep.to < state.rep.from) state.rep.to = state.rep.from; rerender(); }
  if(id==="staff-role"){ rerender(); }
  if(e.target.dataset.perm){
    const [role, perm] = e.target.dataset.perm.split("|"), roles = JSON.parse(JSON.stringify(rolesCfg()));
    const set = new Set(roles[role]||[]); e.target.checked ? set.add(perm) : set.delete(perm); roles[role] = [...set];
    Data.put("config","roles",{ roles }); log("Permission changed", `${ROLES[role]}: ${PERMS.find(p=>p[0]===perm)[1]} ${e.target.checked?"allowed":"removed"}`);
    toast(`${ROLES[role]} ${e.target.checked?"can now":"can no longer"} ${PERMS.find(p=>p[0]===perm)[1].toLowerCase()}`);
  }
  if(id==="h-photo" && e.target.files[0]){
    try{ captureModal(); state.modal.photo = await resizeImage(e.target.files[0]); render(false); }
    catch(_){ toast("That image couldn't be read. Try a JPG or PNG."); }
  }
  if(id==="restore-file" && e.target.files[0]){ restore(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("input", e => {
  const id = e.target.id; if(!id || !id.startsWith("q-")) return;
  if(id==="q-bookings") state.filter.q = e.target.value;
  if(id==="q-patients") state.pq = e.target.value;
  if(id==="q-activity") state.aq = e.target.value;
  const pos = e.target.selectionStart; render(false);
  const el = $("#"+id); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && state.modal){ closeModal(); return; }
  if(e.key!=="Enter") return;
  const id = e.target.id;
  if(id==="l-pass"||id==="l-phone") ($("[data-login]")||$("[data-send-otp]"))?.click();
  if(id==="l-otp") $("[data-otp-login]")?.click();
  if(id==="a-pass"||id==="a-user") $("[data-admin-login]")?.click();
  if(id==="r-pass"||id==="r-otp") ($("[data-register]")||$("[data-register-start]"))?.click();
  if(id==="cp-new2") $("[data-change-pw]")?.click();
});

/* ---------- start ---------- */
async function boot(){
  window.__sadhnaStarted = true;
  let t=null; try{ t=localStorage.getItem("sadhna_theme"); }catch(_){}
  if(t) document.documentElement.dataset.theme=t;
  // The page never waits for storage: it renders at once and fills in when data arrives.
  const sp = $("#splash");
  setTimeout(()=>sp.classList.add("hide"), reduceMotion()?100:500);
  setTimeout(()=>sp.remove(), reduceMotion()?400:1000);
  loadSession();
  if(session?.kind==="staff" && Date.now() - (session.last||0) > CONFIG.sessionTimeoutMin*60*1000){ session = null; saveSession(); }
  if(hasGS() || CONFIG.sheetsUrl){
    Data.cached = loadCatalogCache();
    startConnecting("Connecting to the Google Sheet…");
    try{ await connectSheets(); finishConnecting(); }
    catch(e){
      // Never fall back to this phone only: data would be split across devices. Show the reason instead.
      console.error(e);
      Data.mode = "sheetError"; Data.sheetError = String(e && e.message || e); Data.loaded = true; render();
    }
  } else if(CONFIG.supabase.url && CONFIG.supabase.anonKey){
    startConnecting("Connecting to shared data…");
    try{ await connectSupabase(); }
    catch(e){ console.error(e); await useLocal(); Data.note = "Couldn't reach Supabase, so data is being saved on this device only."; }
    finishConnecting();
  } else if(window.claude && window.claude.use){
    startConnecting("Connecting to shared data…");
    let db = null, perms = null;
    try{ db = await window.claude.use("db"); }catch(_){ db = null; }
    try{ perms = await window.claude.use("permissions"); }catch(_){ perms = null; }
    if(!db){ await useLocal(); finishConnecting(); return; }
    Data.db = db; Data.perms = perms;
    let st = "granted";
    try{ if(perms) st = await perms.state("db"); }catch(_){ st = "granted"; }
    if(st==="granted") await attachDb();
    else if(st==="prompt"){ Data.mode = "needsAllow"; Data.loaded = true; render(); }
    else { await useLocal(); Data.note = "Shared data is turned off for this page, so data is saved on this device only."; finishConnecting(); }
  } else {
    await useLocal(); Data.loaded = true; render();
  }
}
function startConnecting(msg){ Data.mode = "connecting"; Data.connectMsg = msg; Data.loaded = true; render(); }
function finishConnecting(){ render(); if(Data.note){ toast(Data.note); Data.note = ""; } }
async function useLocal(){ loadLocal(); await seedLocalDemo(); }
async function attachDb(){
  Data.mode = "connecting"; render();
  try{ await connectDb(Data.db); }
  catch(e){ console.error(e); await useLocal(); Data.note = "Couldn't reach shared data, so data is saved on this device only."; }
  finishConnecting();
}
async function allowSharedData(){
  let st = "granted";
  try{ if(Data.perms){ const r = await Data.perms.request(["db"]); st = (r && r.db) || "granted"; } }catch(_){ st = "granted"; }
  if(st==="granted") await attachDb();
  else { await useLocal(); Data.note = "Shared data wasn't allowed, so data is saved on this device only. Reload the page to ask again."; finishConnecting(); }
}
setInterval(()=>{ if(session?.kind==="staff" && Date.now() - (session.last||0) > centre().sessionTimeoutMin*60*1000) logout(`Logged out after ${centre().sessionTimeoutMin} minutes without activity`); }, 60*1000);
setInterval(()=>{ if(state.stale && !state.modal && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) && !FORM_ROUTES.includes(state.route.name) && !(state.route.name==="book" && state.step===4) && !(state.route.name==="admin" && state.admin.section==="settings")) { const y = window.scrollY; render(false); window.scrollTo(0,y); } }, 5000);
boot();
